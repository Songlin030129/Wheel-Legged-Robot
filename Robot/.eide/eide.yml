miscInfo:
  uid: 66f05163bd3500e50668556a13a2eab0
targets:
  CtrlBoard-H7_IMU:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32H723xx
        - ARM_MATH_CM7
      incList:
        - .
        - Core/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS
        - Middlewares/Third_Party/FreeRTOS/Source/portable/RVDS/ARM_CM4F
        - Drivers/CMSIS/Device/ST/STM32H7xx/Include
        - Drivers/CMSIS/Include
        - .cmsis/include
        - MDK-ARM/RTE/_CtrlBoard-H7_IMU
        - BSP
        - Modules
        - UserApps
        - Modules/BMI088
        - Modules/DMMotor
        - Modules/PS2
        - Modules/WS2812
        - Modules/Algorithm
        - Modules/Algorithm/mahony
        - Modules/Algorithm/LQR
        - Modules/Algorithm/PID
        - Modules/Algorithm/VMC
        - Middlewares/ST/ARM/DSP/Inc
        - Modules/VOFA
        - Modules/Algorithm/LPF
        - Modules/LKMotor
        - UserApps/Control_Task
        - UserApps/Debug_Task
        - UserApps/IMU_Task
        - UserApps/RemoteControl_Task
        - BSP/BSP_CAN
        - BSP/BSP_DWT
        - BSP/BSP_UART
        - Modules/XboxController
      libList:
        - .cmsis/libdsp
        - .cmsis/libdsp/arm
    excludeList:
      - <virtual_root>/arm_cortexM7lfdp_math.lib
      - <virtual_root>/arm_cortexM7l_math.lib
      - <virtual_root>/Drivers/arm_cortexM7b_math.lib
      - <virtual_root>/Drivers/arm_cortexM7bfdp_math.lib
      - <virtual_root>/Drivers/arm_cortexM7bfsp_math.lib
      - <virtual_root>/Drivers/arm_cortexM7l_math.lib
      - <virtual_root>/Drivers/arm_cortexM7lfdp_math.lib
      - <virtual_root>/Drivers/arm_cortexM7lfsp_math.lib
      - Modules/WS2812
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M7
        floatingPointHardware: double
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
            language-cpp: c++11
            optimization: level-0
            short-enums#wchar: true
            warnings: ac5-like-warnings
          global:
            output-debug-info: enable
          linker:
            misc-controls: --diag_suppress=L6329
            output-format: elf
        scatterFilePath: <YOUR_SCATTER_FILE>.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x00020000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: true
              mem:
                size: "0x00050000"
                startAddr: "0x24000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x00100000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32H723VG
          vendor: ST
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: stm32h7x
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/ctrlboard-h7_imu.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: OpenOCD
